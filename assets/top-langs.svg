<svg width="350" height="120" viewBox="0 0 350 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 16px 'Segoe UI', Ubuntu, sans-serif; fill: #bd93f9; }
    .lang-name { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #f8f8f2; }
    .lang-pct { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #6272a4; }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" width="349" height="119" fill="#282a36" stroke="#44475a" stroke-opacity="0"/>
  
  <text x="25" y="30" class="header">Most Used Languages</text>
  
  <!-- Combined bar -->
  <rect x="25" y="45" width="300" height="8" rx="4" fill="#44475a"/>
  
  <mask id="rect-mask">
    <rect x="25" y="45" width="300" height="8" rx="4" fill="white"/>
  </mask>
  
  <g mask="url(#rect-mask)">
    <rect x="25" y="45" width="107.7" height="8" fill="#4F5D95"/>
    <rect x="132.7" y="45" width="100.26" height="8" fill="#3572A5"/>
    <rect x="232.95999999999998" y="45" width="41.58" height="8" fill="#f1e05a"/>
    <rect x="274.53999999999996" y="45" width="39.57" height="8" fill="#3178c6"/>
    <rect x="314.10999999999996" y="45" width="5.64" height="8" fill="#41b883"/>
    <rect x="319.74999999999994" y="45" width="5.22" height="8" fill="#b07219"/>
  </g>

  <!-- Legend -->
  <g transform="translate(25, 70)">
    <circle cx="5" cy="5" r="5" fill="#4F5D95"/>
    <text x="15" y="9" class="lang-name">PHP <tspan class="lang-pct">35.90%</tspan></text>
  </g>
  <g transform="translate(125, 70)">
    <circle cx="5" cy="5" r="5" fill="#3572A5"/>
    <text x="15" y="9" class="lang-name">Python <tspan class="lang-pct">33.42%</tspan></text>
  </g>
  <g transform="translate(235, 70)">
    <circle cx="5" cy="5" r="5" fill="#f1e05a"/>
    <text x="15" y="9" class="lang-name">JavaScript <tspan class="lang-pct">13.86%</tspan></text>
  </g>
  <g transform="translate(25, 95)">
    <circle cx="5" cy="5" r="5" fill="#3178c6"/>
    <text x="15" y="9" class="lang-name">TypeScript <tspan class="lang-pct">13.19%</tspan></text>
  </g>
  <g transform="translate(125, 95)">
    <circle cx="5" cy="5" r="5" fill="#41b883"/>
    <text x="15" y="9" class="lang-name">Vue <tspan class="lang-pct">1.88%</tspan></text>
  </g>
  <g transform="translate(235, 95)">
    <circle cx="5" cy="5" r="5" fill="#b07219"/>
    <text x="15" y="9" class="lang-name">Java <tspan class="lang-pct">1.74%</tspan></text>
  </g>
</svg>
