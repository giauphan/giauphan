<svg width="350" height="120" viewBox="0 0 350 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 16px 'Segoe UI', Ubuntu, sans-serif; fill: #bd93f9; }
    .lang-name { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #f8f8f2; }
    .lang-pct { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #6272a4; }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" width="349" height="119" fill="#282a36" stroke="#44475a" stroke-opacity="0"/>
  
  <text x="25" y="30" class="header">Most Used Languages</text>
  
  <!-- Combined bar -->
  <rect x="25" y="45" width="300" height="8" rx="4" fill="#44475a"/>
  
  <mask id="rect-mask">
    <rect x="25" y="45" width="300" height="8" rx="4" fill="white"/>
  </mask>
  
  <g mask="url(#rect-mask)">
    <rect x="25" y="45" width="137.52" height="8" fill="#f1e05a"/>
    <rect x="162.52" y="45" width="132.66" height="8" fill="#3572A5"/>
    <rect x="295.18" y="45" width="14.37" height="8" fill="#4F5D95"/>
    <rect x="309.55" y="45" width="6.63" height="8" fill="#c6538c"/>
    <rect x="316.18" y="45" width="6.45" height="8" fill="#663399"/>
    <rect x="322.63" y="45" width="2.37" height="8" fill="#f7523f"/>
  </g>

  <!-- Legend -->
  <g transform="translate(25, 70)">
    <circle cx="5" cy="5" r="5" fill="#f1e05a"/>
    <text x="15" y="9" class="lang-name">JavaScript <tspan class="lang-pct">45.84%</tspan></text>
  </g>
  <g transform="translate(125, 70)">
    <circle cx="5" cy="5" r="5" fill="#3572A5"/>
    <text x="15" y="9" class="lang-name">Python <tspan class="lang-pct">44.22%</tspan></text>
  </g>
  <g transform="translate(235, 70)">
    <circle cx="5" cy="5" r="5" fill="#4F5D95"/>
    <text x="15" y="9" class="lang-name">PHP <tspan class="lang-pct">4.79%</tspan></text>
  </g>
  <g transform="translate(25, 95)">
    <circle cx="5" cy="5" r="5" fill="#c6538c"/>
    <text x="15" y="9" class="lang-name">SCSS <tspan class="lang-pct">2.21%</tspan></text>
  </g>
  <g transform="translate(125, 95)">
    <circle cx="5" cy="5" r="5" fill="#663399"/>
    <text x="15" y="9" class="lang-name">CSS <tspan class="lang-pct">2.15%</tspan></text>
  </g>
  <g transform="translate(235, 95)">
    <circle cx="5" cy="5" r="5" fill="#f7523f"/>
    <text x="15" y="9" class="lang-name">Blade <tspan class="lang-pct">0.79%</tspan></text>
  </g>
</svg>
